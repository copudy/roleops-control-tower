# First-install check: run only the reviewed scanner commit, never PR code.
name: Repository Safety Bootstrap
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: repository-safety-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scan:
    name: Repository Safety / scan
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable reviewed scanner only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1efb1406786f4a84cd1687ef70e2f0343ee9677c
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete incoming history without executing PR code
        env:
          SAFETY_BASE: ${{ github.event.pull_request.base.sha }}
          SAFETY_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/safety/ci_scan.py
